<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="阿旻同学工具箱导航，整理自飞书文档的工具链接合集。">
  <title>阿旻同学 | 工具箱</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar" id="top">
    <div class="wrap topbar-inner">
      <a class="brand" href="#top" aria-label="阿旻同学工具箱">
        <span class="brand-mark">🏺</span>
        <span class="brand-title">阿旻同学 | 工具箱</span>
      </a>
      <div class="search" role="search">
        <label class="search-box">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-3.8-3.8"></path>
          </svg>
          <span class="sr-only">搜索工具</span>
          <input id="searchInput" type="search" placeholder="搜索工具、网址、关键词" autocomplete="off" spellcheck="false">
        </label>
        <button id="clearSearch" class="clear-btn" type="button" hidden aria-label="清空搜索">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap page-main">
    <section class="intro-block" aria-label="文档说明">
      <div class="intro-icon" id="introIcon"></div>
      <div class="intro-copy" id="introCopy"></div>
    </section>

    <section class="quick-section" aria-labelledby="quickTitle">
      <div class="subheading">
        <h2 id="quickTitle">快捷入口</h2>
      </div>
      <div class="quick-grid" id="quickGrid"></div>
    </section>

    <section class="tools-section" aria-labelledby="toolsTitle">
      <div class="section-heading">
        <h2 id="toolsTitle">🧰 视频中的工具</h2>
        <span class="result-count" id="resultCount"></span>
      </div>
      <div class="tool-grid" id="toolGrid"></div>
      <div id="emptyState" class="empty-state" hidden>
        <span>没有找到匹配的工具</span>
      </div>
      <p id="ending" class="ending"></p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <a id="sourceLink" href="#" target="_blank" rel="noopener noreferrer">飞书文档原文</a>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
